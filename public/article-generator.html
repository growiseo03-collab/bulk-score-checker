<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aura Core — Content Generator</title>
<style>
  :root {
    --bg: #10161c;
    --panel: #161f27;
    --panel-2: #1c2731;
    --line: #26333d;
    --text: #e7edf2;
    --muted: #8296a6;
    --accent: #3fb8a6;
    --accent-dim: #2c8577;
    --warn: #e0a458;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 22px 32px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.3px; }
  header span { color: var(--muted); font-size: 13px; }
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 0;
    min-height: calc(100vh - 65px);
  }
  .sidebar {
    border-right: 1px solid var(--line);
    padding: 24px;
  }
  .field { margin-bottom: 22px; }
  label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  select, input[type="text"] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  input[type="text"]::placeholder { color: #55697a; }
  input[type="text"]:focus, select:focus { outline: none; border-color: var(--accent-dim); }
  .type-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .type-btn {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 10px 8px;
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
  }
  .type-btn:hover { border-color: var(--accent-dim); color: var(--text); }
  .type-btn.active {
    background: rgba(63,184,166,0.12);
    border-color: var(--accent);
    color: var(--accent);
  }
  .generate-btn {
    width: 100%;
    margin-top: 8px;
    background: var(--accent);
    color: #08201c;
    border: none;
    padding: 13px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .generate-btn:hover:not(:disabled) { background: #52c9b8; }

  .main { padding: 24px 32px; }
  .output-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 22px;
    min-height: 300px;
  }
  .output-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .output-meta .tag {
    display: inline-block;
    font-size: 11px;
    color: var(--accent);
    background: rgba(63,184,166,0.1);
    border: 1px solid var(--accent-dim);
    padding: 3px 9px;
    border-radius: 20px;
    margin-right: 6px;
  }
  .actions button {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    margin-left: 8px;
  }
  .actions button:hover { border-color: var(--accent-dim); }
  #article {
    white-space: pre-wrap;
    line-height: 1.65;
    font-size: 14.5px;
    color: var(--text);
  }
  .placeholder { color: var(--muted); font-size: 14px; }
  .platforms {
    margin-top: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px 22px;
  }
  .platforms h3 {
    margin: 0 0 4px 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  .platforms p.hint { color: var(--muted); font-size: 12.5px; margin: 0 0 12px 0; }
  .platform-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .platform-chip {
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12.5px;
    color: var(--text);
    text-decoration: none;
  }
  .platform-chip:hover { border-color: var(--accent-dim); color: var(--accent); }
  .backlink-note {
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--warn);
  }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.25); border-top-color: #08201c;
    border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>Content Generator</h1>
  <span>Aura Core Digital — link-building content, on demand</span>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="field">
      <label>Website</label>
      <select id="websiteSelect"><option>Loading...</option></select>
    </div>

    <div class="field">
      <label>Focus keyword</label>
      <input type="text" id="focusKeyword" placeholder="e.g. best crm for small business" />
    </div>

    <div class="field">
      <label>Target audience</label>
      <input type="text" id="targetAudience" placeholder="e.g. small business owners new to CRM tools" />
    </div>

    <div class="field">
      <label>Content type</label>
      <div class="type-grid" id="typeGrid"></div>
    </div>

    <button class="generate-btn" id="generateBtn" disabled>Select a type to generate</button>
  </div>

  <div class="main">
    <div class="output-card">
      <div class="output-meta">
        <div id="metaTags"></div>
        <div class="actions">
          <button id="copyBtn">Copy</button>
          <button id="downloadBtn">Download .txt</button>
        </div>
      </div>
      <div id="article" class="placeholder">Pick a website and content type, then click Generate. The article will appear here instantly.</div>
    </div>

    <div class="platforms" id="platformsCard" style="display:none;">
      <h3>Suggested places to post this</h3>
      <p class="hint">Verify each site's current submission rules before posting — policies change.</p>
      <div class="platform-list" id="platformList"></div>
      <div class="backlink-note" id="backlinkNote"></div>
    </div>
  </div>
</div>

<script>
  const CONTENT_TYPES = [
    { id: "article", label: "Article" },
    { id: "guestPost", label: "Guest Post" },
    { id: "web2", label: "Web 2.0" },
    { id: "profileBacklink", label: "Profile Backlink" },
    { id: "pdfSubmission", label: "PDF Submission" },
    { id: "imageSubmission", label: "Image Submission" },
    { id: "articleSubmission", label: "Article Submission" },
  ];

  let websites = [];
  let selectedType = null;
  let lastResult = null;

  const websiteSelect = document.getElementById("websiteSelect");
  const typeGrid = document.getElementById("typeGrid");
  const generateBtn = document.getElementById("generateBtn");
  const articleEl = document.getElementById("article");
  const metaTags = document.getElementById("metaTags");
  const platformsCard = document.getElementById("platformsCard");
  const platformList = document.getElementById("platformList");
  const backlinkNote = document.getElementById("backlinkNote");

  async function init() {
    const res = await fetch("/config/websites-config.json");
    const data = await res.json();
    websites = data.websites;
    websiteSelect.innerHTML = websites
      .map((w) => `<option value="${w.id}">${w.name}</option>`)
      .join("");

    typeGrid.innerHTML = CONTENT_TYPES.map(
      (t) => `<button class="type-btn" data-type="${t.id}">${t.label}</button>`
    ).join("");

    document.querySelectorAll(".type-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".type-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        selectedType = btn.dataset.type;
        generateBtn.disabled = false;
        generateBtn.textContent = "Generate";
      });
    });
  }

  generateBtn.addEventListener("click", async () => {
    if (!selectedType) return;
    const websiteId = websiteSelect.value;
    const focusKeyword = document.getElementById("focusKeyword").value.trim();
    const targetAudience = document.getElementById("targetAudience").value.trim();

    if (!focusKeyword) {
      alert("Enter a focus keyword first.");
      return;
    }
    if (!targetAudience) {
      alert("Enter a target audience first.");
      return;
    }

    generateBtn.disabled = true;
    generateBtn.innerHTML = '<span class="spinner"></span>Generating...';
    articleEl.classList.add("placeholder");
    articleEl.textContent = "Generating your content...";
    platformsCard.style.display = "none";

    try {
      const res = await fetch("/generate-article", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ websiteId, contentType: selectedType, focusKeyword, targetAudience }),
      });
      const data = await res.json();

      if (!res.ok) {
        articleEl.textContent = "Error: " + (data.error || "Something went wrong");
        return;
      }

      lastResult = data;
      articleEl.classList.remove("placeholder");
      articleEl.textContent = data.article;

      metaTags.innerHTML = `
        <span class="tag">${data.website}</span>
        <span class="tag">${data.contentType}</span>
        <span class="tag">~${data.wordCountTarget} words</span>
        <span class="tag">kw: ${data.focusKeyword}</span>
      `;

      if (data.suggestedPlatforms && data.suggestedPlatforms.length) {
        platformList.innerHTML = data.suggestedPlatforms
          .map((p) =>
            p.url
              ? `<a class="platform-chip" href="${p.url}" target="_blank">${p.name}</a>`
              : `<span class="platform-chip">${p.name}</span>`
          )
          .join("");
        backlinkNote.textContent = `Backlink used: ${data.backlink.url} (anchor: "${data.backlink.anchorText}")`;
        platformsCard.style.display = "block";
      }
    } catch (err) {
      articleEl.textContent = "Network error: " + err.message;
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = "Generate";
    }
  });

  document.getElementById("copyBtn").addEventListener("click", () => {
    if (!lastResult) return;
    navigator.clipboard.writeText(lastResult.article);
    const btn = document.getElementById("copyBtn");
    btn.textContent = "Copied!";
    setTimeout(() => (btn.textContent = "Copy"), 1200);
  });

  document.getElementById("downloadBtn").addEventListener("click", () => {
    if (!lastResult) return;
    const blob = new Blob([lastResult.article], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${lastResult.website}-${lastResult.contentType}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  });

  init();
</script>

</body>
</html>
